{% extends "base.html" %}

{% block title %}{{ error_code }} · AquaSense{% endblock %}

{% block content %}
<section class="error-page" aria-labelledby="error-heading">
  <span class="error-code">{{ error_code }}</span>
  <h1 id="error-heading">{{ error_title }}</h1>
  <p>{{ error_message }}</p>
  <a class="button" href="{{ url_for('pages.dashboard') }}">Back to dashboard</a>
</section>
{% endblock %}
